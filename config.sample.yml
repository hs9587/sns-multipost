# config.yml にコピーして記入する。config.yml は .gitignore 済み（コミットされない）

fedibird:
  base_url: https://fedibird.com
  access_token: "Fedibird の 設定 > 開発 で作成したアクセストークン"
  account_id: "自分のアカウントID（数字）。ruby bin/whoami で確認できる"

bluesky:
  handle: "you.bsky.social"      # あなたのハンドル
  app_password: ""               # 設定 > プライバシーとセキュリティ > アプリパスワード で発行

tumblr:
  client_id: ""                  # Tumblr アプリの OAuth Consumer Key
  client_secret: ""              # 同 Secret Key
  refresh_token: ""              # OAuth2 認可で取得した refresh token（初回の種）
  blog_identifier: "you.tumblr.com"  # 投稿先ブログ（例 you.tumblr.com）

blogger:
  client_id: ""                  # Google Cloud の OAuth2 クライアントID
  client_secret: ""              # 同シークレット
  refresh_token: ""              # scope=blogger の refresh token
  blog_id: ""                    # Blogger のブログID（数字）

x:
  consumer_key: ""               # X 開発者ポータルの API Key
  consumer_secret: ""            # 同 API Key Secret
  access_token: ""               # ユーザーのアクセストークン
  access_token_secret: ""        # 同シークレット
  username: "you"                # URL 組立用（@ 抜きのユーザー名）
  # APIクレジットを購入する場合のみtargetsへ追加する。Web画面の自動操作は行わない。

threads:
  app_id: ""                     # MetaアプリのThreads App ID
  app_secret: ""                 # 同Threads App Secret
  redirect_uri: "https://localhost/threads/callback"  # Meta側にも同じURLを登録
  # 通常は bin/threads_auth で state/threads_token.json に長期トークンを保存する。
  # 手動取得したトークンを直接使う場合だけ access_token を記入する。
  access_token: ""

jotter:
  # セーブポイントURLはログイン資格情報です。実際の値はGit管理外のconfig.ymlだけに記入します。
  savepoint_url: ""
  account_name: "your-name"      # 誤った一時アカウントへの投稿を防ぐ確認用の表示名

# 投稿先。ポスター実装済みで、かつ認証情報を記入した SNS だけ並べる。
# watch は Fedibird の新着から、post は bin/post の本文から作るジョブの投稿先。
targets:
  watch:
    - bluesky
    - tumblr
    - blogger
    - mixi
    - jotter
  post:
    - fedibird
    - bluesky
    - tumblr
    - blogger
    - threads
    - mixi
    - mixi2
    - jotter

# true にすると投稿直前で止まる（実投稿しない）
dry_run: true
