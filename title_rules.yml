# タイトル辞書。上のセクションほど優先。「ドライラン＋指摘」で育てる
ohayo:
  keywords: [おはよう]
  title: おはよう

coffee:
  vocab: [コーヒー, 珈琲, ホット, アイス, アメリカン, ブレンド, ブリュー,
          モカ, キリマンジャロ, マンデリン, グアテマラ, エチオピア, コロンビア]
  # アイス/ホットは温度の修飾語で単独ではコーヒーと断定できない。
  # 非コーヒー飲料語が同居するときはコーヒー判定しない（アイスティー等をよける）
  modifiers: [アイス, ホット]
  iced: [アイス, コール, コールド, レイ]
  brands: [モカ, キリマンジャロ, マンデリン, グアテマラ, エチオピア, コロンビア,
           アメリカン]
  non_coffee_drinks: [ティー, 紅茶, ルイボス, ジュース, ココア, 抹茶, ミルク, ビール, ワイン]
  shops: [猫廼舎]

# 主食語は主菜より優先。まず foods_priority を見て、無ければ foods
foods_priority: [パン, ブレッド, サンド, デニッシュ, ごはん, ライス]
foods: [スパゲティ, そば, うどん, ラーメン, カレー, おにぎり, 弁当]
# 表記揺れは右側の正規表記をタイトルに使う
food_aliases:
  ご飯: ごはん
  蕎麦: そば
  ソバ: そば
  饂飩: うどん
  ウドン: うどん

fallback_length: 12
